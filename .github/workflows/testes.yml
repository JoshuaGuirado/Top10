name: Testes

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: for f in gamezi-*.js emojizi/js/*.js emojizi/data/*.js contazi/js/*.js memorizi/js/*.js topzi/js/*.js topzi/data/*.js patozi/js/*.js patozi/data/*.js datazi/js/*.js datazi/data/*.js maisoumenozi/js/*.js maisoumenozi/data/*.js cravazi/js/*.js cravazi/data/*.js tamanhozi/js/*.js tamanhozi/data/*.js sw.js; do node --check "$f"; done
      - run: npm test
