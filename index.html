<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TT · Top Ten</title>
  <meta name="description" content="Acenda a memória: adivinhe os 10 itens da lista.">
  <meta name="theme-color" content="#FFC23D">
  <link rel="icon" href="brand/favicon.svg" type="image/svg+xml">
  <meta property="og:title" content="TT · Top Ten">
  <meta property="og:description" content="Acenda a memória: adivinhe os 10 itens da lista.">
  <meta property="og:image" content="brand/og-image.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&family=Archivo+Black&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>
        <img class="logo logo-light" src="brand/logo.svg" alt="TT · Top Ten">
        <img class="logo logo-dark" src="brand/logo-dark.svg" alt="" aria-hidden="true">
      </h1>
      <p class="tagline">Acenda a memória: adivinhe os 10 itens da lista. Você tem 3 vidas.</p>
    </header>

    <section id="menu">
      <h2>Escolha um desafio</h2>
      <ul id="list-picker"></ul>
    </section>

    <section id="game" hidden>
      <h2 id="game-title"></h2>
      <div class="status">
        <span id="score">0/10</span>
        <span id="lives" aria-label="Vidas"></span>
      </div>

      <form id="guess-form" autocomplete="off">
        <input id="guess" type="text" placeholder="Digite um palpite..." aria-label="Palpite" required>
        <button type="submit">Chutar</button>
      </form>
      <p id="feedback" role="status"></p>

      <ol id="board"></ol>

      <p id="wrong-guesses"></p>
      <p id="source" class="source"></p>

      <div class="actions">
        <button id="give-up" type="button" class="secondary">Desistir</button>
        <button id="back" type="button" class="secondary">Outras listas</button>
      </div>
    </section>
  </main>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
