<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gamezi · jogos para jogar com a turma</title>
  <meta name="description" content="Gamezi: jogos rápidos para jogar sozinho, com amigos ou online, direto no navegador. Topzi, o jogo de listas, e Patozi, o jogo de chutar números.">
  <meta name="theme-color" content="#FFF4DE" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#171717" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="brand/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="brand/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="brand/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta property="og:title" content="Gamezi · jogos para jogar com a turma">
  <meta property="og:description" content="Jogos rápidos, direto no navegador: Topzi, o jogo de listas, e Patozi, o do Nem a pato!">
  <meta property="og:image" content="https://top10-bay.vercel.app/brand/gamezi-og.png">
  <script>
    // Links antigos do Topzi apontavam para a raiz (convite de sala, lista compartilhada): manda para o jogo
    // com tudo o que veio no endereço. O retorno do login (links do e-mail) vai para a conta do Gamezi.
    (function () {
      var s = location.search, h = location.hash;
      if (/access_token|error_description|type=recovery/.test(h)) location.replace("conta.html" + h);
      else if (/[?&](sala|code)=/.test(s) || /^#(lista=|como-jogar)/.test(h)) location.replace("topzi/" + s + h);
    })();
    try { var t = localStorage.getItem("tt:theme"); if (t) document.documentElement.dataset.theme = JSON.parse(t); } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&display=swap">
  <link rel="stylesheet" href="gamezi.css">
  <!-- Métricas da Vercel (Web Analytics): visitas por página, sem cookies e sem dados pessoais -->
  <script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <a href="./" aria-label="Gamezi">
        <img class="logo logo-light" src="brand/gamezi-logo.svg" alt="Gamezi">
        <img class="logo logo-dark" src="brand/gamezi-logo-dark.svg" alt="" aria-hidden="true">
      </a>
      <div class="top-actions">
        <a class="account-chip" id="account" href="conta.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8.5" r="4"/><path d="M4.5 20.5c.9-3.8 3.9-6 7.5-6s6.6 2.2 7.5 6"/></svg><span></span></a>
      </div>
    </header>

    <main class="portal">
      <h1 class="portal-tag" data-t="tag">Jogos rápidos para jogar sozinho ou com a turma.</h1>
      <a class="portal-level" id="portal-level" href="conta.html" hidden></a>

      <a class="game-row" href="topzi/">
        <span class="game-icon">
          <img class="logo-light" src="brand/simbolo.svg" alt="" aria-hidden="true">
          <img class="logo-dark" src="brand/simbolo-escuro.svg" alt="" aria-hidden="true">
        </span>
        <span class="game-text">
          <b>Topzi</b>
          <small data-t="topziKind">Adivinhe os itens da lista</small>
          <small class="game-daily" id="daily-tag"></small>
        </span>
        <span class="play" data-t="play">Jogar</span>
      </a>

      <a class="game-row" href="patozi/">
        <span class="game-icon">
          <img class="logo-light" src="brand/patozi-simbolo.svg" alt="" aria-hidden="true">
          <img class="logo-dark" src="brand/patozi-simbolo-escuro.svg" alt="" aria-hidden="true">
        </span>
        <span class="game-text">
          <b>Patozi</b>
          <small data-t="patoziKind">Chute o número sem passar da resposta</small>
          <small class="game-daily" id="pato-tag"></small>
        </span>
        <span class="play" data-t="play">Jogar</span>
      </a>

      <a class="game-row" href="datazi/">
        <span class="game-icon">
          <img class="logo-light" src="brand/datazi-simbolo.svg" alt="" aria-hidden="true">
          <img class="logo-dark" src="brand/datazi-simbolo-escuro.svg" alt="" aria-hidden="true">
        </span>
        <span class="game-text">
          <b>Datazi</b>
          <small data-t="dataziKind">Coloque os acontecimentos em ordem</small>
          <small class="game-daily" id="data-tag"></small>
        </span>
        <span class="play" data-t="play">Jogar</span>
      </a>

      <p class="soon" data-t="soon">Mais jogos em breve.</p>

      <nav class="portal-links">
        <label><span data-t="lang">Idioma</span>
          <select id="lang" class="lang-select"><option value="pt">Português</option><option value="en">English</option><option value="es">Español</option></select>
        </label>
        <button type="button" class="theme-link" id="theme"></button>
      </nav>
    </main>

    <footer class="foot">
      <a href="termos.html" data-t="terms">Termos de uso</a>
      <a href="privacidade.html" data-t="privacy">Privacidade</a>
      <span>© 2026 Gamezi</span>
    </footer>
  </div>

  <script src="gamezi-conta.js"></script>
  <script>
    // Textos do portal em [português, inglês, espanhol]. O idioma é o mesmo escolhido nos jogos (tt:lang).
    var T = {
      lang: ["Idioma", "Language", "Idioma"],
      tag: ["Jogos rápidos para jogar sozinho ou com a turma.", "Quick games to play solo or with your friends.", "Juegos rápidos para jugar solo o con amigos."],
      topziKind: ["Adivinhe os itens da lista", "Guess the items on the list", "Adivina los ítems de la lista"],
      patoziKind: ["Chute o número sem passar da resposta", "Guess the number without going over", "Di el número sin pasarte de la respuesta"],
      daily: ["Lista do dia #{n}", "Daily list #{n}", "Lista del día #{n}"],
      patoDaily: ["Pato do dia #{n}", "Daily duck #{n}", "Pato del día #{n}"],
      dataziKind: ["Coloque os acontecimentos em ordem", "Put the events in order", "Pon los acontecimientos en orden"],
      dataDaily: ["Datazi do dia #{n}", "Daily Datazi #{n}", "Datazi del día #{n}"],
      play: ["Jogar", "Play", "Jugar"],
      soon: ["Mais jogos em breve.", "More games coming soon.", "Más juegos muy pronto."],
      terms: ["Termos de uso", "Terms of use", "Términos de uso"],
      privacy: ["Privacidade", "Privacy", "Privacidad"],
      enter: ["Entrar", "Sign in", "Entrar"],
      level: ["Nível {n} · {a} de {b} conquistas", "Level {n} · {a} of {b} achievements", "Nivel {n} · {a} de {b} logros"],
      mine: ["Minha conta", "My account", "Mi cuenta"],
      accountTitle: ["Conta Gamezi: uma conta só para todos os jogos", "Gamezi account: one account for every game", "Cuenta Gamezi: una sola cuenta para todos los juegos"],
      dark: ["Tema escuro", "Dark theme", "Tema oscuro"],
      light: ["Tema claro", "Light theme", "Tema claro"],
    };
    var LANGS = ["pt", "en", "es"];
    function load(k) { try { return JSON.parse(localStorage.getItem("tt:" + k)); } catch (e) { return null; } }
    function save(k, v) { try { localStorage.setItem("tt:" + k, JSON.stringify(v)); } catch (e) {} }
    var lang = load("lang");
    if (LANGS.indexOf(lang) < 0) lang = LANGS.indexOf((navigator.language || "pt").slice(0, 2)) >= 0 ? navigator.language.slice(0, 2) : "pt";
    function t(k) { return T[k][LANGS.indexOf(lang)]; }

    // Número da lista do dia do Topzi (mesma conta de topzi/js/diaria.js).
    function dailyNumber() {
      var d = new Date();
      return Math.floor((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - Date.UTC(2026, 9, 1)) / 864e5) + 1;
    }

    // Número do Pato do dia do Patozi (mesma conta de patozi/js/jogo.js).
    function patoNumber() {
      var d = new Date();
      return Math.floor((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - Date.UTC(2026, 9, 8)) / 864e5) + 1;
    }

    var ICONS = {
      moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>',
      sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>',
    };
    function isDark() { return (document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")) === "dark"; }

    function render() {
      document.documentElement.lang = { pt: "pt-BR", en: "en", es: "es" }[lang];
      document.querySelectorAll("[data-t]").forEach(function (el) { el.textContent = t(el.dataset.t); });
      document.getElementById("lang").value = lang;
      var n = dailyNumber();
      var tag = document.getElementById("daily-tag");
      tag.hidden = n < 1;
      tag.textContent = t("daily").replace("{n}", n);
      var pn = patoNumber();
      var ptag = document.getElementById("pato-tag");
      ptag.hidden = pn < 1;
      ptag.textContent = t("patoDaily").replace("{n}", pn);
      var dtag = document.getElementById("data-tag");
      dtag.hidden = pn < 1;
      dtag.textContent = t("dataDaily").replace("{n}", pn);
      // Nível do Gamezi (soma o que se joga em todos os jogos neste aparelho).
      var prog = gameziProgresso();
      var nivel = document.getElementById("portal-level");
      nivel.hidden = !prog.xp;
      nivel.textContent = t("level").replace("{n}", prog.nivel).replace("{a}", prog.conquistas.filter(function (c) { return c.feita; }).length).replace("{b}", prog.conquistas.length);
      // Conta do Gamezi (a mesma em todos os jogos): só lê a sessão salva, sem carregar o Supabase.
      var logado = gameziLogado();
      var conta = document.getElementById("account");
      conta.classList.toggle("on", logado);
      conta.querySelector("span").textContent = t(logado ? "mine" : "enter");
      conta.title = logado ? gameziSessao().email : t("accountTitle");
      conta.setAttribute("aria-label", t(logado ? "mine" : "enter"));
      var b = document.getElementById("theme");
      b.innerHTML = ICONS[isDark() ? "sun" : "moon"] + "<span>" + t(isDark() ? "light" : "dark") + "</span>";
    }
    document.getElementById("lang").addEventListener("change", function (e) { lang = e.target.value; save("lang", lang); render(); });
    document.getElementById("theme").addEventListener("click", function () {
      var next = isDark() ? "light" : "dark";
      document.documentElement.dataset.theme = next;
      save("theme", next);
      render();
    });
    render();

    if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
      addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
    }
  </script>
</body>
</html>
