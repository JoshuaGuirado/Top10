<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mapazi · o tamanho de verdade dos países | Gamezi</title>
  <meta name="description" content="Mapazi: ajuste o tamanho dos países e descubra o tamanho de verdade de cada um, sem a distorção dos mapas. Um desafio por dia, igual para todo mundo, e partida livre.">
  <meta name="theme-color" content="#FFF4DE" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#171717" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="../brand/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="../brand/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="../brand/apple-touch-icon.png">
  <link rel="manifest" href="../manifest.webmanifest">
  <script>try { var t = localStorage.getItem("tt:theme"); if (t) document.documentElement.dataset.theme = JSON.parse(t); } catch (e) {}</script>
  <meta property="og:title" content="Mapazi · o tamanho de verdade dos países">
  <meta property="og:description" content="Qual o tamanho de verdade de cada país? Ajuste e descubra.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&display=swap">
  <link rel="stylesheet" href="style.css">
  <!-- Métricas da Vercel (Web Analytics): visitas por página, sem cookies e sem dados pessoais -->
  <script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
  <div class="topbar">
    <div class="topbar-left">
      <a class="icon-btn gamezi-back" href="../" data-i18n-aria="nav.back" aria-label="Voltar para o Gamezi" title="Gamezi"><svg class="ui-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
      <button type="button" class="logo-btn" id="home-btn" data-i18n-aria="nav.home" aria-label="Início">
        <img class="logo logo-light" src="../brand/mapazi-logo.svg" alt="Mapazi">
        <img class="logo logo-dark" src="../brand/mapazi-logo-dark.svg" alt="" aria-hidden="true">
      </button>
    </div>
    <div class="topbar-actions">
      <button type="button" class="icon-btn" id="help-btn" data-i18n-aria="help.title" aria-label="Como jogar"></button>
      <button type="button" class="icon-btn" id="settings-btn" data-i18n-aria="nav.settings" aria-label="Configurações"><svg class="ui-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    </div>
  </div>

  <main>
    <!-- Início -->
    <section id="screen-home" class="screen home">
      <div class="home-head">
        <img class="home-symbol logo-light" src="../brand/mapazi-simbolo.svg" alt="" aria-hidden="true">
        <img class="home-symbol logo-dark" src="../brand/mapazi-simbolo-escuro.svg" alt="" aria-hidden="true">
        <h1 class="home-tag" data-i18n="home.tag">Qual o tamanho de verdade de cada país? Ajuste e descubra.</h1>
      </div>
      <div class="home-card daily" id="daily-card"></div>
      <div class="home-card home-row">
        <div><b data-i18n="home.free">Partida livre</b><span id="free-sub"></span></div>
        <button type="button" class="btn dark" id="free-btn" data-i18n="btn.play">Jogar</button>
      </div>
      <nav class="home-links">
        <button type="button" class="link-btn" id="help-link" data-i18n="help.title">Como jogar</button>
        <a href="../" data-i18n="home.more">Mais jogos</a>
      </nav>
      <footer class="site-foot">
        <a href="../termos.html">Termos de uso</a>
        <a href="../privacidade.html">Privacidade</a>
        <span>© 2026 Gamezi</span>
      </footer>
    </section>

    <!-- Partida: os dois países, a barra para ajustar o vermelho e, depois de confirmar, o tamanho real -->
    <section id="screen-game" class="screen" hidden>
      <div class="game-head">
        <b id="game-title"></b>
        <span class="game-round" id="game-round"></span>
        <span class="game-score" id="game-score"></span>
      </div>
      <p class="legend" id="legend"></p>
      <p class="game-ask" id="game-ask" data-i18n="game.ask">Deixe o país vermelho do tamanho de verdade.</p>
      <svg class="stage" id="stage" role="img" preserveAspectRatio="xMidYMid meet"></svg>
      <div id="game-play">
        <div class="size-row">
          <button type="button" class="size-btn" id="size-down" data-i18n-aria="game.smaller" aria-label="Diminuir">−</button>
          <input type="range" id="size" min="0" max="1000" step="1" data-i18n-aria="game.size" aria-label="Tamanho">
          <button type="button" class="size-btn" id="size-up" data-i18n-aria="game.bigger" aria-label="Aumentar">+</button>
        </div>
        <button type="button" class="btn big" id="game-confirm" data-i18n="game.confirm">Confirmar</button>
      </div>
      <div id="game-reveal" hidden>
        <div class="reveal" id="reveal"></div>
        <button type="button" class="btn big" id="game-next"></button>
      </div>
      <div class="actions center"><button type="button" class="link-btn" id="game-quit" data-i18n="btn.home">Início</button></div>
    </section>

    <!-- Resultado -->
    <section id="screen-results" class="screen" hidden>
      <div class="result-head">
        <p class="kicker" id="res-kicker"></p>
        <p class="result-score" id="res-score"></p>
        <p class="muted" id="res-sub"></p>
        <div class="actions center">
          <button type="button" class="btn" id="res-share" data-i18n="btn.share">Compartilhar</button>
          <button type="button" class="btn" id="res-again" data-i18n="btn.again">Jogar de novo</button>
          <button type="button" class="btn ghost" id="res-home" data-i18n="btn.home">Início</button>
        </div>
      </div>
      <div class="leaderboard" id="leaderboard" hidden></div>
      <h3 data-i18n="res.rounds">As rodadas</h3>
      <ol class="rounds" id="res-rounds"></ol>
    </section>
  </main>

  <!-- Como jogar -->
  <dialog class="dialog" id="help-dialog">
    <div class="dialog-inner">
      <div class="dialog-head"><h2 data-i18n="help.title">Como jogar</h2><button type="button" class="text-btn" data-close data-i18n="btn.close">Fechar</button></div>
      <div class="help-body" id="help-body"></div>
    </div>
  </dialog>

  <!-- Configurações: idioma e tema -->
  <dialog class="dialog settings-dialog" id="settings-dialog">
    <div class="dialog-inner">
      <div class="dialog-head"><h2 data-i18n="nav.settings">Configurações</h2><button type="button" class="text-btn" data-close data-i18n="btn.close">Fechar</button></div>
      <label class="setting-row"><span data-i18n="nav.lang">Idioma</span>
        <select id="lang-select" class="lang-select">
          <option value="pt">Português</option><option value="en">English</option><option value="es">Español</option>
        </select>
      </label>
      <div class="setting-row"><span data-i18n="nav.theme">Tema</span><button type="button" class="icon-btn" id="theme-btn"></button></div>
    </div>
  </dialog>

  <script src="js/jogo.js"></script>
  <script src="data/paises.js"></script>
  <script src="js/textos.js"></script>
  <script src="../topzi/js/config.js"></script>
  <script src="../gamezi-conta.js"></script>
  <script src="../gamezi-ranking.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
