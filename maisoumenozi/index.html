<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="description" content="Maisoumenozi: tem mais ou tem menos? Compare habitantes, alturas, pesos, velocidades e muito mais. Um desafio por dia, igual para todo mundo, e partida livre.">

  <meta name="theme-color" content="#171717" media="(prefers-color-scheme: dark)">

  <link rel="apple-touch-icon" href="../brand/apple-touch-icon.png">

</head>
<body>
  <div class="topbar">
    <div class="topbar-left">
      <a class="icon-btn gamezi-back" href="../" data-i18n-aria="nav.back" aria-label="Voltar para o Gamezi" title="Gamezi"><svg class="ui-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
      <button type="button" class="logo-btn" id="home-btn" data-i18n-aria="nav.home" aria-label="Início">
        <img class="logo logo-light" src="../brand/maisoumenozi-logo.svg" alt="Maisoumenozi">
        <img class="logo logo-dark" src="../brand/maisoumenozi-logo-dark.svg" alt="" aria-hidden="true">
      </button>
    </div>
    <div class="topbar-actions">
      <button type="button" class="icon-btn" id="help-btn" data-i18n-aria="help.title" aria-label="Como jogar"></button>
      <button type="button" class="icon-btn" id="settings-btn" data-i18n-aria="nav.settings" aria-label="Configurações"><svg class="ui-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    </div>
  </div>

  <main>
    <!-- Início: contra o relógio (o principal), o desafio do dia e o modo sem errar -->
    <section id="screen-home" class="screen home">
      <div class="home-head">
        <img class="home-symbol logo-light" src="../brand/maisoumenozi-simbolo.svg" alt="" aria-hidden="true">
        <img class="home-symbol logo-dark" src="../brand/maisoumenozi-simbolo-escuro.svg" alt="" aria-hidden="true">
        <h1 class="home-tag" data-i18n="home.tag">Tem mais ou tem menos? Responda rápido.</h1>
      </div>
      <div class="home-card clock-card">
        <div class="clock-top">
          <span class="clock-ico" aria-hidden="true"></span>
          <div><b data-i18n="home.clock">Contra o relógio</b><span id="clock-sub"></span></div>
        </div>
        <button type="button" class="btn big" id="clock-btn" data-i18n="btn.play">Jogar</button>
      </div>
      <div class="home-card daily" id="daily-card"></div>
      <div class="home-card home-row">
        <div><b data-i18n="home.free">Sem errar</b><span id="free-sub"></span></div>
        <button type="button" class="btn dark" id="free-btn" data-i18n="btn.play">Jogar</button>
      </div>
      <nav class="home-links">
        <button type="button" class="link-btn" id="help-link" data-i18n="help.title">Como jogar</button>
        <a href="../" data-i18n="home.more">Mais jogos</a>
      </nav>
      <footer class="site-foot">
        <a href="../termos.html">Termos de uso</a>
        <a href="../privacidade.html">Privacidade</a>
        <span>© 2026 Gamezi</span>
      </footer>
    </section>

    <!-- Partida, de cima para baixo: placar · referência ("Comparado com") · pergunta · respostas -->
    <section id="screen-game" class="screen game" hidden>
      <div class="hud">
        <span class="hud-left" id="hud-left"></span>
        <span class="combo" id="hud-combo" hidden></span>
        <span class="hud-right" id="hud-right"></span>
        <span class="float" id="float" aria-hidden="true"></span>
      </div>
      <div class="timebar" id="timebar" hidden><i id="timebar-fill"></i></div>
      <div class="dots" id="game-dots" aria-hidden="true"></div>

      <div class="stage" id="stage">
        <!-- rodada comum -->
        <div id="round-normal">
          <p class="ref-label" data-i18n="game.compared">Comparado com</p>
          <div class="ref" id="ref"></div>
          <div class="ask" id="ask">
            <p class="ask-name" id="ask-name"></p>
            <p class="ask-q" id="ask-q"></p>
            <div class="ask-answer" id="ask-answer" hidden></div>
          </div>
          <div class="answers" id="game-answers">
            <button type="button" class="btn answer up" id="btn-up"></button>
            <button type="button" class="btn answer down" id="btn-down"></button>
          </div>
        </div>
        <!-- comparação maluca: a pergunta e os dois para escolher -->
        <div id="round-uau" hidden>
          <p class="uau-question" id="uau-question"></p>
          <div class="choices">
            <button type="button" class="choice" id="uau-a"></button>
            <button type="button" class="choice" id="uau-b"></button>
          </div>
        </div>
      </div>

      <div class="feedback-box" id="game-feedback" hidden>
        <p class="verdict" id="game-verdict"></p>
        <p class="fact" id="game-fact" hidden></p>
        <button type="button" class="btn big" id="game-next"></button>
      </div>
    </section>

    <!-- Resultado -->
    <section id="screen-results" class="screen results" hidden>
      <div class="result-head">
        <p class="kicker" id="res-kicker"></p>
        <p class="result-score" id="res-score"></p>
        <p class="muted" id="res-sub"></p>
        <p class="record" id="res-record" hidden></p>
        <div class="actions center">
          <button type="button" class="btn" id="res-again" data-i18n="btn.again">Jogar de novo</button>
          <button type="button" class="btn dark" id="res-share" data-i18n="btn.share">Compartilhar</button>
          <button type="button" class="btn ghost" id="res-home" data-i18n="btn.home">Início</button>
        </div>
      </div>
      <h3 data-i18n="res.list">As comparações</h3>
      <ol class="pairs" id="res-list"></ol>
    </section>
  </main>

  <canvas id="fx" aria-hidden="true"></canvas>

  <!-- Como jogar -->
  <dialog class="dialog" id="help-dialog">
    <div class="dialog-inner">
      <div class="dialog-head"><h2 data-i18n="help.title">Como jogar</h2><button type="button" class="text-btn" data-close data-i18n="btn.close">Fechar</button></div>
      <div class="help-body" id="help-body"></div>
    </div>
  </dialog>

  <!-- Configurações: idioma e tema -->
  <dialog class="dialog settings-dialog" id="settings-dialog">
    <div class="dialog-inner">
      <div class="dialog-head"><h2 data-i18n="nav.settings">Configurações</h2><button type="button" class="text-btn" data-close data-i18n="btn.close">Fechar</button></div>
      <label class="setting-row"><span data-i18n="nav.lang">Idioma</span>
        <select id="lang-select" class="lang-select">
          <option value="pt">Português</option><option value="en">English</option><option value="es">Español</option>
        </select>
      </label>
      <div class="setting-row"><span data-i18n="nav.theme">Tema</span><button type="button" class="icon-btn" id="theme-btn"></button></div>
      <div class="setting-row"><span data-i18n="nav.sound">Som</span><button type="button" class="icon-btn" id="sound-btn"></button></div>
    </div>
  </dialog>

  <script src="js/jogo.js"></script>
  <script src="data/assuntos-1.js"></script>
  <script src="data/assuntos-2.js"></script>
  <script src="data/assuntos-3.js"></script>
  <script src="data/grupos.js"></script>
  <script src="data/uau-1.js"></script>
  <script src="data/assuntos-4.js"></script>
  <script src="data/uau-2.js"></script>
  <script src="data/perguntas.js"></script>
  <script src="../gamezi-conta.js"></script>
  <script src="js/textos.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
