<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página não encontrada · Gamezi</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/brand/favicon.svg" type="image/svg+xml">
  <script>try { var t = localStorage.getItem("tt:theme"); if (t) document.documentElement.dataset.theme = JSON.parse(t); } catch (e) {}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&display=swap">
  <link rel="stylesheet" href="/docs.css">
  <style>
    .lost { min-height: 80vh; display: grid; place-content: center; text-align: center; gap: 4px; }
    .lost .num { font-stretch: 75%; font-weight: 800; font-size: clamp(6rem, 30vw, 11rem); line-height: .85; letter-spacing: -0.03em; margin: 0; }
    .lost .num span { color: var(--accent); }
    .lost p { margin: 8px auto 0; max-width: 34ch; }
    .lost .btn { display: inline-block; margin-top: 24px; justify-self: center; text-decoration: none; background: var(--accent); color: var(--on-accent); padding: 14px 40px; border-radius: 999px; font-weight: 700; }
    .lost .btn:hover { filter: brightness(1.08); color: var(--on-accent); }
  </style>
</head>
<body>
  <main class="doc lost">
    <p class="num">4<span>0</span>4</p>
    <h1 style="font-size:clamp(1.8rem,7vw,2.6rem)">Essa não estava na lista</h1>
    <p class="lead">A página que você procurou não existe ou mudou de lugar. Chute de novo pelo começo.</p>
    <a class="btn" href="/">Voltar ao Gamezi</a>
  </main>
</body>
</html>
